# hive bridge forwards — the curated openings from the hive to your MacBook.
#
# Each line publishes one TCP port on the bridge that tunnels to a target
# reachable from the bridge (usually host.docker.internal = your Mac).
# Nodes connect to it as  bridge:<listen-port>.
#
# Format:   <name>   <listen-port-on-bridge>   <target-host:port>
#
# Apply changes with:  hive bridge reload
#
# Examples:
# postgres   15432   host.docker.internal:5432
# ollama     11434   host.docker.internal:11434
# mac-ssh    2222    host.docker.internal:22
# devserver  8080    host.docker.internal:8080


