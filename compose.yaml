name: hive

networks:
  net:
    # A normal (non-internal) bridge network: containers have direct internet
    # and reach the Mac via host.docker.internal. No curated egress bridge.
    name: hive-net

volumes:
  shared:
    name: hive-shared
  claude:
    # Per-node Claude state: root gets its own volume, just like every `hive new`
    # node gets hive-claude-<name>. Credentials/history are NOT shared across the
    # hive — each container logs in on its own.
    name: hive-claude-root

services:
  root:
    build:
      context: .
      dockerfile: images/root/Dockerfile
    image: hive/root
    container_name: hive-root
    hostname: root
    init: true
    restart: unless-stopped
    labels:
      hive.role: root
      hive.name: root
    networks: [net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared:/shared
      - claude:/home/dev/.claude
      - ./:/workspace
